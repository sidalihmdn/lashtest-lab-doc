server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docusaurus emits one index.html per route, so a plain static root serves
    # every real page. Only unknown paths fall through to the branded 404.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
